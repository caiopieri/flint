<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Flint</title>
    <!-- Design tokens (generated from tokens.json) — same source as the native
         chrome, so the editor matches across the WKWebView seam (ADR-D03). -->
    <link rel="stylesheet" href="./tokens.css" />
    <style>
      :root { color-scheme: light dark; }
      html, body, #editor { margin: 0; height: 100%; }
      #editor { position: relative; }
      body {
        background: var(--flint-bg);
        color: var(--flint-text-primary);
        font-family: var(--flint-font-sans);
        -webkit-text-size-adjust: 100%;
      }
      #editor { height: 100dvh; }
      .cm-editor { height: 100%; }
      .flint-editor-host { position: relative; }
      .flint-link-menu {
        position: absolute;
        z-index: 20;
        min-width: 220px;
        max-width: min(360px, calc(100% - var(--flint-space-4)));
        max-height: 240px;
        overflow-y: auto;
        padding: var(--flint-space-1);
        background: var(--flint-surface);
        border: 1px solid var(--flint-border);
        border-radius: var(--flint-radius-lg);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      }
      .flint-link-menu-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--flint-space-3);
        width: 100%;
        padding: var(--flint-space-2) var(--flint-space-3);
        border: 0;
        border-radius: var(--flint-radius-md);
        background: transparent;
        color: var(--flint-text-primary);
        font: inherit;
        text-align: left;
      }
      .flint-link-menu-row.is-selected,
      .flint-link-menu-row:active { background: var(--flint-selection); }
      .flint-link-menu-row.is-create .flint-link-menu-label { color: var(--flint-accent); }
      .flint-link-menu-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .flint-link-menu-path {
        flex: 0 0 auto;
        max-width: 45%;
        overflow: hidden;
        color: var(--flint-text-muted);
        font-size: 0.78em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .flint-link-menu-empty {
        padding: var(--flint-space-3);
        color: var(--flint-text-secondary);
        font-size: 0.9em;
      }
      .flint-outline-root {
        position: absolute;
        z-index: 25;
        top: var(--flint-space-4);
        right: var(--flint-space-3);
      }
      .flint-outline-button {
        width: 36px;
        height: 32px;
        border: 1px solid var(--flint-border);
        border-radius: var(--flint-radius-md);
        background: color-mix(in srgb, var(--flint-surface) 82%, transparent);
        color: var(--flint-text-secondary);
        font: 1.35rem/1 var(--flint-font-sans);
        cursor: pointer;
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(18px) saturate(115%);
      }
      .flint-outline-button:active { background: var(--flint-selection); }
      .flint-outline-panel {
        position: absolute;
        top: 40px;
        right: 0;
        width: min(300px, calc(100vw - 32px));
        max-height: min(60vh, 420px);
        overflow-y: auto;
        padding: var(--flint-space-1);
        background: var(--flint-surface);
        border: 1px solid var(--flint-border);
        border-radius: var(--flint-radius-lg);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      }
      .flint-outline-row {
        display: block;
        width: 100%;
        overflow: hidden;
        border: 0;
        border-radius: var(--flint-radius-md);
        background: transparent;
        color: var(--flint-text-primary);
        font: inherit;
        line-height: 1.25;
        padding-block: var(--flint-space-2);
        text-align: left;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .flint-outline-row:active { background: var(--flint-selection); }
    </style>
  </head>
  <body>
    <div id="editor"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
